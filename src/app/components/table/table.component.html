<div class="table-wrapper">
  <h2 *ngIf="title">{{ title }}</h2>
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

  <ng-container *ngFor="let col of displayedColumns" [matColumnDef]="col">
    <th mat-header-cell mat-sort-header *matHeaderCellDef>{{ columnLabels[col]||col }}</th>
    <td mat-cell *matCellDef="let element"> {{ getDisplayValue(element, col) }}
 </td>
  </ng-container>

  <ng-container *ngIf="actions" matColumnDef="azioni">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button (click)="edit.emit(element)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="delete.emit(element)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns.concat(actions ? ['azioni'] : [])"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns.concat(actions ? ['azioni'] : [])"></tr>
</table>

<mat-paginator [pageSizeOptions]="[10, 15, 20]" showFirstLastButtons></mat-paginator>
</div>
