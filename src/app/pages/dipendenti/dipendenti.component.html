<button mat-icon-button (click)="addDipendente()">
  <mat-icon>add</mat-icon>
</button>

<app-table
  [data]="(dataSource$ | async) || []"
  [displayedColumns]="['id', 'nome', 'cognome', 'data_nascita']"
  [columnLabels]="{
    id:'ID',
    nome:'Nome',
    cognome:'Cognome',
    data_nascita:'Data di nascita'
  }"
  title="Tabella Dipendenti"
  [actions]="true"
  (edit)="editDipendente($event)"
  (delete)="deleteDipendente($event)">
</app-table>
